name: AirCard-iOS
options:
  bundleIdPrefix: com.mak5er
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.1"
    CURRENT_PROJECT_VERSION: "1.3.1"
    TARGETED_DEVICE_FAMILY: "1"
    # AirliftFFI is arm64-only (aws-lc-rs / idevice); drop x86_64 simulator slice.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  AirCard-iOS:
    type: application
    platform: iOS
    sources:
      - path: ios-app
        # The Live Activity is a separate extension with its own @main.
        # Without this it would also compile into the app and produce
        # "'main' attribute can only apply to one type in a module".
        excludes:
          - AirCardLiveActivity/**
      # The tweak library is data shared with the desktop engine. The iOS app
      # parses the same JSON so a tweak cannot look supported on one platform
      # and unsupported on the other.
      - path: core-engine/library
        buildPhase: resources
        type: folder
    dependencies:
      - framework: AirliftFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: "AirCard-iOS"
        PRODUCT_BUNDLE_IDENTIFIER: com.mak5er.aircard
        INFOPLIST_FILE: ios-app/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # idevice's static lib pulls in C++ symbols (aws-lc); link libc++.
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: NO

  # Live Activity extension. This is what renders the AI on the Lock Screen and
  # Notification Center (and in the Dynamic Island on devices that have one).
  # It has to be a separate extension target because ActivityKit renders it
  # out of process.
  AirCardLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: ios-app/AirCardLiveActivity
      # Shared with the app, but dependency-free so the extension does not have
      # to compile the AI engines.
      - path: ios-app/AirCardAI/AILiveActivityAttributes.swift
    settings:
      base:
        PRODUCT_NAME: AirCardLiveActivity
        PRODUCT_BUNDLE_IDENTIFIER: com.mak5er.aircard.liveactivity
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_CFBundleDisplayName: AirCard AI
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: AirCard-iOS
        embed: false
  AirCard-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests
    dependencies:
      - target: AirCard-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mak5er.aircard.tests

schemes:
  AirCard-iOS:
    build:
      targets:
        AirCard-iOS: all
        AirCardLiveActivity: all
    test:
      targets:
        - AirCard-iOSTests
