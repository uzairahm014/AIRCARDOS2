name: build-ios

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # macOS runner: Xcode only exists here, which is the whole reason this
    # build cannot run on Windows.
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: true

      - name: Select Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project AirCard-iOS.xcodeproj \
            -scheme AirCard-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build 2>&1 | tee build/xcodebuild.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find build/DerivedData/Build/Products -name 'AirCard-iOS.app' -type d | head -n 1)"
          if [ -z "$APP" ]; then
            echo "No .app produced - the build step above failed."
            exit 1
          fi
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/AirCard-iOS.app
          cd build
          zip -qr AirCard-iOS.ipa Payload
          rm -rf Payload
          ls -lh AirCard-iOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-ipa
          path: build/AirCard-iOS.ipa
          if-no-files-found: error

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/xcodebuild.log
          if-no-files-found: warn

      # Write the failure straight back into the repository. Without this the
      # only way to see why a build failed is to open the GitHub web UI and
      # read the log by hand, which is a poor way to iterate.
      - name: Commit build log back to the repo
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build-reports
          if [ -f build/xcodebuild.log ]; then
            cp build/xcodebuild.log build-reports/xcodebuild.log
            grep -E "error:|warning: .*deprecat" build/xcodebuild.log \
              | sort -u | head -200 > build-reports/errors.txt || true
          fi
          echo "finished at $(date -u +%FT%TZ)" > build-reports/status.txt
          git config user.name "aircard-build-bot"
          git config user.email "aircard-build-bot@users.noreply.github.com"
          git add -f build-reports || true
          git commit -q -m "build report $(date -u +%s)" || echo "nothing to commit"
          git push || echo "could not push report (branch moved?)"